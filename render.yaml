services:
  - type: web
    name: transitpay-api
    runtime: docker
    plan: free  # Use 'starter' for production ($7/month)
    dockerfilePath: ./TransitPay.API/Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: JWT_KEY
        generateValue: true
      - key: ADMIN_BOOTSTRAP_PASSWORD
        generateValue: true
      - key: DATABASE_HOST
        fromDatabase:
          name: transitpay-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: transitpay-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: transitpay-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: transitpay-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: transitpay-db
          property: password
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
    healthCheckPath: /api/auth/validate
    autoDeploy: true

databases:
  - name: transitpay-db
    plan: free  # Use 'shared' for production ($7/month)
    databaseName: transitpay
    user: transitpay_user