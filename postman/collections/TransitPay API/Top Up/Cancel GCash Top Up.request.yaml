$kind: http-request
name: Cancel GCash Top Up
method: POST
url: '{{baseUrl}}/api/topup/gcash/cancel'
order: 2300
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
body:
  type: json
  content: |-
    {
      "sessionId": "{{gcashSessionId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Session is cancelled", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
          pm.expect(json.data.status).to.eql("CANCELLED");
      });
