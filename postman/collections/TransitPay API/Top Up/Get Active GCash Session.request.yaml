$kind: http-request
name: Get Active GCash Session
method: GET
url: '{{baseUrl}}/api/topup/gcash/active/{{cardId}}'
order: 2500
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Active session or null is returned", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
          if (json.data !== null) {
              pm.expect(json.data.status).to.eql("PENDING");
              pm.collectionVariables.set("gcashSessionId", json.data.sessionId);
          }
      });
