$kind: http-request
name: Scan QR Code
method: POST
url: '{{baseUrl}}/api/payment/scan'
order: 4000
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
body:
  type: json
  content: |-
    {
      "qrData": "{{qrData}}",
      "signature": "{{qrSignature}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response confirms scan result", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("isValid");
      });
      pm.test("QR scan is valid", function () {
          const json = pm.response.json();
          pm.expect(json.isValid).to.be.true;
      });
