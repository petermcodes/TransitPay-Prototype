$kind: http-request
name: Validate Card
method: GET
url: '{{baseUrl}}/api/cards/validate/{{cardNumber}}'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has validation result", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("isValid");
      });
      pm.test("Response has balance info", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("balance");
      });
